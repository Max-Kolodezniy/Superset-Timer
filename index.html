<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superset Timer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111; color: #eee;
    margin: 0; padding: 16px;
    max-width: 480px; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; opacity: 0.7; margin: 0 0 16px; }
  section { margin-bottom: 24px; }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; opacity: 0.8; }
  input[type="number"] {
    width: 100%; padding: 10px; font-size: 1.1rem;
    background: #222; color: #eee; border: 1px solid #444; border-radius: 8px;
  }
  button {
    width: 100%; padding: 18px; font-size: 1.3rem; margin-top: 12px;
    border: none; border-radius: 10px; cursor: pointer;
  }
  #startBtn, #mainBtn { background: #2d6cdf; color: white; }
  #finishBtn { background: #b33; color: white; }
  #mainBtn:disabled { background: #444; color: #888; }
  #phaseLabel { font-size: 1.4rem; text-align: center; margin-bottom: 8px; }
  #timerDisplay { font-size: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .log-entry { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .log-entry pre { white-space: pre-wrap; font-size: 0.85rem; margin: 0 0 8px; }
  .log-entry button { background: #333; color: #eee; padding: 8px; font-size: 0.9rem; margin-top: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>Superset Timer</h1>

<section id="configScreen">
  <label for="supersetsInput">Supersets</label>
  <input type="number" id="supersetsInput" value="3" min="1">

  <label for="exercisesInput">Exercises per superset</label>
  <input type="number" id="exercisesInput" value="6" min="1">

  <label for="restExerciseInput">Rest between exercises (seconds)</label>
  <input type="number" id="restExerciseInput" value="60" min="0">

  <label for="restSupersetInput">Rest between supersets (seconds)</label>
  <input type="number" id="restSupersetInput" value="180" min="0">

  <button id="startBtn">Start</button>
</section>

<section id="sessionScreen" hidden>
  <div id="phaseLabel"></div>
  <div id="timerDisplay">00:00</div>
  <button id="mainBtn">Rest</button>
  <button id="finishBtn">Finish</button>
</section>

<section id="logScreen">
  <button id="exportBtn">Export MD</button>
  <div id="logList"></div>
</section>

<script>
// Business logic added in later tasks.
</script>
</body>
</html>
