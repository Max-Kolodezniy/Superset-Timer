<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superset Timer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111; color: #eee;
    margin: 0; padding: 16px;
    max-width: 480px; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; opacity: 0.7; margin: 0 0 16px; }
  section { margin-bottom: 24px; }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; opacity: 0.8; }
  input[type="number"] {
    width: 100%; padding: 10px; font-size: 1.1rem;
    background: #222; color: #eee; border: 1px solid #444; border-radius: 8px;
  }
  button {
    width: 100%; padding: 18px; font-size: 1.3rem; margin-top: 12px;
    border: none; border-radius: 10px; cursor: pointer;
  }
  #startBtn, #mainBtn { background: #2d6cdf; color: white; }
  #finishBtn { background: #b33; color: white; }
  #mainBtn:disabled { background: #444; color: #888; }
  #phaseLabel { font-size: 1.4rem; text-align: center; margin-bottom: 8px; }
  #timerDisplay { font-size: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .log-entry { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .log-entry pre { white-space: pre-wrap; font-size: 0.85rem; margin: 0 0 8px; }
  .log-entry button { background: #333; color: #eee; padding: 8px; font-size: 0.9rem; margin-top: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>Superset Timer</h1>

<section id="configScreen">
  <label for="supersetsInput">Supersets</label>
  <input type="number" id="supersetsInput" value="3" min="1">

  <label for="exercisesInput">Exercises per superset</label>
  <input type="number" id="exercisesInput" value="6" min="1">

  <label for="restExerciseInput">Rest between exercises (seconds)</label>
  <input type="number" id="restExerciseInput" value="60" min="0">

  <label for="restSupersetInput">Rest between supersets (seconds)</label>
  <input type="number" id="restSupersetInput" value="180" min="0">

  <button id="startBtn">Start</button>
</section>

<section id="sessionScreen" hidden>
  <div id="phaseLabel"></div>
  <div id="timerDisplay">00:00</div>
  <button id="mainBtn">Rest</button>
  <button id="finishBtn">Finish</button>
</section>

<section id="logScreen">
  <button id="exportBtn">Export MD</button>
  <div id="logList"></div>
</section>

<script>
let state = null; // null = idle/config screen; otherwise the active session

const configScreen = document.getElementById('configScreen');
const sessionScreen = document.getElementById('sessionScreen');
const phaseLabel = document.getElementById('phaseLabel');
const timerDisplay = document.getElementById('timerDisplay');
const mainBtn = document.getElementById('mainBtn');
const finishBtn = document.getElementById('finishBtn');

function fmtMMSS(totalSeconds) {
  const neg = totalSeconds < 0;
  const abs = Math.round(Math.abs(totalSeconds));
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  const str = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return neg ? '-' + str : str;
}

function isLastExerciseInSuperset() {
  return state.exerciseIndex === state.config.exercisesPerSuperset;
}

function isAtFinalRest() {
  return state.phase === 'rest'
    && state.supersetIndex === state.config.supersets
    && state.exerciseIndex === state.config.exercisesPerSuperset;
}

function render() {
  if (!state) {
    configScreen.hidden = false;
    sessionScreen.hidden = true;
    return;
  }
  configScreen.hidden = true;
  sessionScreen.hidden = false;

  const now = Date.now();
  const elapsedSec = (now - state.phaseStartEpoch) / 1000;

  if (state.phase === 'exercise') {
    phaseLabel.textContent = 'S' + state.supersetIndex + ' E' + state.exerciseIndex;
    timerDisplay.textContent = fmtMMSS(elapsedSec);
    mainBtn.textContent = 'Rest';
    mainBtn.disabled = false;
  } else {
    phaseLabel.textContent = 'Rest';
    timerDisplay.textContent = fmtMMSS(state.currentRestDefault - elapsedSec);
    mainBtn.textContent = 'Next';
    mainBtn.disabled = isAtFinalRest();
  }
}

function onStart() {
  const supersets = parseInt(document.getElementById('supersetsInput').value, 10);
  const exercisesPerSuperset = parseInt(document.getElementById('exercisesInput').value, 10);
  const restExercise = parseInt(document.getElementById('restExerciseInput').value, 10);
  const restSuperset = parseInt(document.getElementById('restSupersetInput').value, 10);

  const now = Date.now();
  state = {
    config: { supersets, exercisesPerSuperset, restExercise, restSuperset },
    supersetIndex: 1,
    exerciseIndex: 1,
    phase: 'exercise',
    phaseStartEpoch: now,
    sessionStartEpoch: now,
    currentRestDefault: restExercise,
    entries: [],
  };
  render();
}

function onMainBtn() {
  const now = Date.now();
  const elapsedSec = Math.round((now - state.phaseStartEpoch) / 1000);

  if (state.phase === 'exercise') {
    state.entries.push({ label: 'S' + state.supersetIndex + ' E' + state.exerciseIndex, seconds: elapsedSec });
    state.currentRestDefault = isLastExerciseInSuperset() ? state.config.restSuperset : state.config.restExercise;
    state.phase = 'rest';
    state.phaseStartEpoch = now;
  } else {
    state.entries.push({ label: 'Rest', seconds: elapsedSec });
    if (isLastExerciseInSuperset()) {
      state.supersetIndex += 1;
      state.exerciseIndex = 1;
    } else {
      state.exerciseIndex += 1;
    }
    state.phase = 'exercise';
    state.phaseStartEpoch = now;
  }
  render();
}

document.getElementById('startBtn').addEventListener('click', onStart);
mainBtn.addEventListener('click', onMainBtn);

function tick() {
  if (state) render();
}
setInterval(tick, 1000);

render();
</script>
</body>
</html>
